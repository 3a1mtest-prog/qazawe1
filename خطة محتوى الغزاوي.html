<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AL-GHAZAWE CONTENT STRATEGY OS — 2QHE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN SYSTEM ============ */
:root{
  --bg:#04100C; --bg-2:#071710;
  --panel:#0A1F18; --panel-2:#0D2A20; --panel-3:#113328;
  --line:#1A4234; --line-soft:#143427;
  --brand:#0E7C5A; --brand-deep:#0A5B42;
  --acc:#3FD69B; --acc-dim:#2AA97A;
  --silver:#B9C9C1; --text:#EDF7F2; --muted:#8AA79B; --muted-2:#6B8A7E;
  --ax-fin:#2FBF84; --ax-dig:#37B9B0; --ax-soc:#74E3A5; --ax-per:#C2D4CA;
  --warn:#E0B863; --danger:#E06A6A;
  --r-s:8px; --r:14px; --r-l:20px;
  --sh:0 18px 44px rgba(0,0,0,.45);
  --sh-s:0 6px 18px rgba(0,0,0,.30);
  --f-d:'Tajawal','Segoe UI',Tahoma,sans-serif;
  --f-b:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --nav-w:264px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1100px 600px at 88% -8%, rgba(14,124,90,.20), transparent 60%),
    radial-gradient(900px 520px at 6% 108%, rgba(10,91,66,.16), transparent 62%),
    var(--bg);
  color:var(--text); font-family:var(--f-b); font-size:15px; line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.d{font-family:var(--f-d);font-weight:800;line-height:1.3}
a{color:var(--acc);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-2)}
::-webkit-scrollbar-thumb{background:#17392C;border-radius:20px;border:2px solid var(--bg-2)}
::-webkit-scrollbar-thumb:hover{background:#20513E}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ LAYOUT ============ */
.app{display:flex;min-height:100vh}
.nav{
  width:var(--nav-w);flex:0 0 var(--nav-w);position:sticky;top:0;height:100vh;overflow-y:auto;
  background:linear-gradient(180deg,#08201800,#071A13 12%,#061710);
  border-left:1px solid var(--line);padding:20px 14px 28px;
}
.brandbox{display:flex;align-items:center;gap:11px;padding:6px 8px 18px;border-bottom:1px solid var(--line-soft);margin-bottom:14px}
.logo{
  width:44px;height:44px;flex:0 0 44px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--brand),#062F22);border:1px solid #1E5B45;
  font-family:var(--f-d);font-weight:900;font-size:17px;color:#DFFBEE;letter-spacing:-1px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
}
.brandbox .bt{font-family:var(--f-d);font-weight:900;font-size:15px;letter-spacing:.3px}
.brandbox .bs{font-size:11px;color:var(--muted-2);letter-spacing:2px;font-weight:500}
.navgroup{font-size:10.5px;letter-spacing:2.4px;color:var(--muted-2);padding:14px 10px 7px;font-weight:600}
.navbtn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:none;border:0;cursor:pointer;
  padding:9px 11px;border-radius:10px;color:var(--muted);font-size:13.5px;font-weight:500;
  transition:background .15s,color .15s;position:relative;
}
.navbtn .n{font-size:10.5px;color:var(--muted-2);font-variant-numeric:tabular-nums;min-width:17px}
.navbtn:hover{background:#0C271D;color:var(--text)}
.navbtn.on{background:linear-gradient(90deg,#0E3A2B,#0B2B20 70%);color:#EAFFF5;font-weight:700}
.navbtn.on::before{content:"";position:absolute;right:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--acc)}
.navbtn.on .n{color:var(--acc)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 22px;background:rgba(4,16,12,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);
}
.menubtn{display:none}
.search{flex:1;min-width:170px;position:relative}
.search input{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:9px 36px 9px 12px;color:var(--text);font-size:13.5px;
}
.search input::placeholder{color:var(--muted-2)}
.search .ic{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted-2);font-size:13px}
.content{padding:24px 22px 90px;max-width:1400px;width:100%}

/* ============ ATOMS ============ */
.btn{
  background:var(--panel-2);border:1px solid var(--line);color:var(--text);
  padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;
  transition:.15s;white-space:nowrap;
}
.btn:hover{background:var(--panel-3);border-color:#26604A}
.btn.p{background:linear-gradient(135deg,var(--brand),#0A6047);border-color:#1E7053;color:#F1FFF9}
.btn.p:hover{background:linear-gradient(135deg,#129068,#0B6F51)}
.btn.g{background:transparent}
.btn.d{border-color:#5A2A2A;color:#F0B5B5;background:#2A1414}
.btn.d:hover{background:#3A1A1A}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:linear-gradient(160deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:var(--r-l);padding:20px;box-shadow:var(--sh-s)}
.card.tight{padding:15px;border-radius:var(--r)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)} .g5{grid-template-columns:repeat(5,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mut{color:var(--muted);font-size:13px}
.sm{font-size:12.5px}
.eyebrow{font-size:10.5px;letter-spacing:3px;color:var(--acc-dim);font-weight:700;margin-bottom:8px}
.pagehead{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line-soft)}
.pagehead h1{font-size:27px;letter-spacing:-.5px}
.pagehead p{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:74ch}
.sec-t{font-size:17px;margin:26px 0 12px;display:flex;align-items:center;gap:9px}
.sec-t::before{content:"";width:4px;height:17px;border-radius:3px;background:var(--acc)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;border:1px solid var(--line);background:#0B2419;color:var(--muted);white-space:nowrap}
.chip.solid{background:#123A2C;color:#CFEEE0}
.tag-fin{color:var(--ax-fin);border-color:rgba(47,191,132,.36);background:rgba(47,191,132,.10)}
.tag-dig{color:var(--ax-dig);border-color:rgba(55,185,176,.36);background:rgba(55,185,176,.10)}
.tag-soc{color:var(--ax-soc);border-color:rgba(116,227,165,.34);background:rgba(116,227,165,.10)}
.tag-per{color:var(--ax-per);border-color:rgba(194,212,202,.32);background:rgba(194,212,202,.09)}
.divider{height:1px;background:var(--line-soft);margin:18px 0}
.empty{text-align:center;padding:44px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);background:#07190F}
.empty b{display:block;color:var(--text);font-family:var(--f-d);font-size:16px;margin-bottom:6px}

/* ============ DASHBOARD ============ */
.stat{background:linear-gradient(155deg,var(--panel-2),#08201800);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;position:relative;overflow:hidden}
.stat .v{font-family:var(--f-d);font-size:29px;font-weight:900;letter-spacing:-1px;line-height:1.1}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:2px}
.stat::after{content:"";position:absolute;left:-24px;bottom:-30px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(63,214,155,.13),transparent 70%)}
.bar{height:8px;border-radius:20px;background:#0B2A20;overflow:hidden;border:1px solid var(--line-soft)}
.bar > i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--brand),var(--acc));transition:width .5s ease}
.mixrow{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.mixrow .nm{width:118px;flex:0 0 118px;font-size:12.5px;color:var(--muted)}
.mixrow .bar{flex:1}
.mixrow .pc{width:44px;text-align:left;font-size:12px;font-variant-numeric:tabular-nums;color:var(--text);font-weight:600}
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut .ring{width:132px;height:132px;border-radius:50%;flex:0 0 132px;display:grid;place-items:center;position:relative}
.donut .ring::after{content:"";position:absolute;inset:17px;border-radius:50%;background:var(--panel)}
.donut .ring .in{position:relative;z-index:2;text-align:center}
.donut .ring .in b{font-family:var(--f-d);font-size:23px;display:block;line-height:1}
.donut .ring .in span{font-size:10.5px;color:var(--muted)}
.lgd{display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.lgd i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-left:7px}

/* ============ RHYTHM STRIP (signature) ============ */
.rhythm{display:flex;gap:3px;padding:14px;background:#061810;border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.rhythm .rc{flex:1;min-width:15px;height:52px;border-radius:5px;background:#0C2419;position:relative;cursor:pointer;transition:transform .15s;border:1px solid transparent}
.rhythm .rc:hover{transform:translateY(-3px);border-color:#2A6B52}
.rhythm .rc .cap{position:absolute;bottom:-1px;right:0;left:0;text-align:center;font-size:8.5px;color:#04120C;font-weight:700}
.rhythm .rc.fin{background:linear-gradient(180deg,var(--ax-fin),#0D5C40)}
.rhythm .rc.dig{background:linear-gradient(180deg,var(--ax-dig),#0C4F4B)}
.rhythm .rc.soc{background:linear-gradient(180deg,var(--ax-soc),#1B6E44)}
.rhythm .rc.per{background:linear-gradient(180deg,var(--ax-per),#4E6459)}

/* ============ CALENDAR ============ */
.calhead{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px}
.calhead div{text-align:center;font-size:11px;color:var(--muted-2);letter-spacing:1px;font-weight:600;padding:5px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{
  background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;min-height:126px;padding:8px;
  display:flex;flex-direction:column;gap:6px;position:relative;transition:border-color .15s;
}
.day:hover{border-color:#27614A}
.day .dn{font-family:var(--f-d);font-size:12px;color:var(--muted-2);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.day .dn .dd{font-size:9.5px;font-weight:500}
.day.blank{background:#05130E;border-style:dashed;opacity:.45}
.ccard{
  text-align:right;width:100%;background:#0C251B;border:1px solid var(--line);border-right:3px solid var(--acc);
  border-radius:9px;padding:6px 8px;cursor:pointer;transition:.15s;
}
.ccard:hover{background:#12362A;transform:translateX(-2px)}
.ccard .tt{font-size:11.5px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccard .mt{display:flex;gap:5px;align-items:center;margin-top:4px;font-size:9.5px;color:var(--muted-2);flex-wrap:wrap}
.ccard.fin{border-right-color:var(--ax-fin)} .ccard.dig{border-right-color:var(--ax-dig)}
.ccard.soc{border-right-color:var(--ax-soc)} .ccard.per{border-right-color:var(--ax-per)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--muted-2)}
.dot.ready{background:var(--acc)} .dot.published{background:#4FA3FF} .dot.idea{background:#5C7A6E}
.dot.writing,.dot.design,.dot.filming,.dot.editing{background:var(--warn)} .dot.scheduled{background:#9B8CFF}

/* ============ TABLE ============ */
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:840px}
th{
  text-align:right;font-size:11px;letter-spacing:1px;color:var(--muted-2);font-weight:700;
  padding:11px 12px;background:#092018;border-bottom:1px solid var(--line);position:sticky;top:0;white-space:nowrap
}
td{padding:11px 12px;border-bottom:1px solid var(--line-soft);font-size:13px;vertical-align:top}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:#0D2A20}
td .ttl{font-weight:700;font-size:13.2px;display:block;margin-bottom:3px}

/* ============ LIBRARY CARDS ============ */
.lib{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(288px,1fr))}
.item{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative;transition:.15s;border-top:2px solid var(--line)}
.item:hover{border-color:#27614A;background:var(--panel-2)}
.item.fin{border-top-color:var(--ax-fin)} .item.dig{border-top-color:var(--ax-dig)}
.item.soc{border-top-color:var(--ax-soc)} .item.per{border-top-color:var(--ax-per)}
.item h4{font-size:14.5px;margin-bottom:7px;line-height:1.45}
.item .meta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.item .body{font-size:12.8px;color:var(--muted);line-height:1.7}
.item .acts{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.hooklist{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.hook{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line-soft);border-radius:11px;padding:10px 12px}
.hook .hx{flex:1;font-size:13.2px;line-height:1.65}
.hook .hn{font-family:var(--f-d);font-size:11px;color:var(--muted-2);padding-top:3px;min-width:26px}
.steps{counter-reset:s;display:grid;gap:8px}
.step{display:flex;gap:10px;background:#0A2118;border:1px solid var(--line-soft);border-radius:10px;padding:9px 11px}
.step .k{font-family:var(--f-d);font-size:11px;color:var(--acc-dim);min-width:56px;font-weight:700;padding-top:2px}
.step .v{flex:1;font-size:13px}

/* ============ FILTERS ============ */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
select,input[type=text],input[type=date],input[type=number],textarea{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13px;color:var(--text);
}
select{cursor:pointer;padding-left:26px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(10px) calc(50% - 2px),calc(15px) calc(50% - 2px);background-size:5px 5px,5px 5px;background-repeat:no-repeat;-webkit-appearance:none;appearance:none}
textarea{width:100%;resize:vertical;line-height:1.7}
label.fld{display:block;margin-bottom:12px}
label.fld > span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
label.fld input,label.fld select,label.fld textarea{width:100%}

/* ============ MODAL ============ */
.overlay{position:fixed;inset:0;background:rgba(2,9,6,.78);backdrop-filter:blur(6px);z-index:100;display:none;padding:24px;overflow-y:auto}
.overlay.on{display:block}
.modal{max-width:960px;margin:0 auto;background:linear-gradient(170deg,#0C2A20,#081C15);border:1px solid #1F5641;border-radius:var(--r-l);box-shadow:var(--sh);overflow:hidden}
.modal .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line);background:#0A241B;position:sticky;top:0;z-index:3}
.modal .mh h3{font-size:19px;line-height:1.4}
.modal .mb{padding:20px;max-height:none}
.modal .mf{display:flex;gap:8px;justify-content:flex-start;padding:14px 20px;border-top:1px solid var(--line);background:#0A241B;flex-wrap:wrap;position:sticky;bottom:0}
.x{background:none;border:1px solid var(--line);color:var(--muted);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:16px;line-height:1;flex:0 0 32px}
.x:hover{color:var(--text);background:#123326}
.dtl{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin-bottom:16px}
.dtl .f{background:#0A2118;border:1px solid var(--line-soft);border-radius:10px;padding:8px 11px}
.dtl .f b{display:block;font-size:10.5px;color:var(--muted-2);letter-spacing:.8px;font-weight:600;margin-bottom:2px}
.dtl .f span{font-size:13px}
.block{background:#081D15;border:1px solid var(--line-soft);border-radius:12px;padding:13px 15px;margin-bottom:12px}
.block > h5{font-size:12px;letter-spacing:1.4px;color:var(--acc-dim);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-d)}
.block p{font-size:13.4px;line-height:1.85;white-space:pre-wrap}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;padding-bottom:1px}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 12px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--acc)}

/* ============ TOAST ============ */
.toast{
  position:fixed;bottom:22px;right:22px;z-index:300;background:#0E3628;border:1px solid #2A7659;color:#EAFFF5;
  padding:11px 17px;border-radius:12px;box-shadow:var(--sh);font-size:13.5px;font-weight:600;
  transform:translateY(18px);opacity:0;pointer-events:none;transition:.25s
}
.toast.on{transform:translateY(0);opacity:1}
.toast.err{background:#3A1616;border-color:#7A3333}

/* ============ KPI ============ */
.kpi{display:grid;grid-template-columns:1.4fr .7fr .7fr 1.6fr;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line-soft)}
.kpi input{width:100%;text-align:center;padding:6px 8px;font-variant-numeric:tabular-nums}
.kpi .nm{font-size:13px;font-weight:600}

/* ============ MOBILE ============ */
@media(max-width:1080px){ .g5{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(2,1fr)} }
@media(max-width:900px){
  .nav{position:fixed;right:0;top:0;z-index:120;transform:translateX(100%);transition:transform .25s;box-shadow:-14px 0 40px rgba(0,0,0,.5)}
  .nav.open{transform:translateX(0)}
  .menubtn{display:inline-flex}
  .g3,.g2{grid-template-columns:1fr}
  .content{padding:18px 14px 80px}
  .topbar{padding:10px 14px}
  .cal{grid-template-columns:1fr;gap:6px}
  .calhead{display:none}
  .day{min-height:auto}
  .day.blank{display:none}
  .day .dn{font-size:13px}
  .pagehead h1{font-size:22px}
  .overlay{padding:0}
  .modal{border-radius:0;min-height:100vh}
  .kpi{grid-template-columns:1fr 1fr;gap:8px}
  .kpi .nm{grid-column:1/-1}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:110;display:none}
  .scrim.on{display:block}
}
@media(max-width:520px){ .g4,.g5{grid-template-columns:repeat(2,1fr)} .stat .v{font-size:24px} }

/* ============ PRINT ============ */
@media print{
  body{background:#fff;color:#111}
  .nav,.topbar,.acts,.btn,.filters,.rhythm{display:none!important}
  .card,.item,.block,.twrap{border-color:#ccc;background:#fff;box-shadow:none;color:#111}
  .content{padding:0;max-width:100%}
  th{background:#eee;color:#111}
  td,.mut,.item .body{color:#222}
  h1,h2,h3,h4{color:#000}
}
</style>
</head>
<body>
<div class="scrim" id="scrim" onclick="toggleNav(false)"></div>
<div class="app">

  <!-- ============ NAVIGATION ============ -->
  <aside class="nav" id="nav">
    <div class="brandbox">
      <div class="logo">AG</div>
      <div>
        <div class="bt">AL-GHAZAWE</div>
        <div class="bs">CONTENT OS · 2QHE</div>
      </div>
    </div>
    <div id="navlist"></div>

<script>
/* ================= STORAGE / STATE ================= */
const LS_KEY = 'alghazawe_content_os_v1';
let DB = null, VIEW = 'overview', SEARCH = '', EDIT_ID = null;
let F = {month:'',week:'',axis:'',format:'',series:'',pillar:'',funnel:'',purpose:'',status:''};

function seedDB(){
  return {
    version:1,
    months:JSON.parse(JSON.stringify(MONTH_SEED)),
    plan:JSON.parse(JSON.stringify(PLAN_SEED)),
    hooks:JSON.parse(JSON.stringify(HOOKS_SEED)),
    reels:JSON.parse(JSON.stringify(REELS_SEED)),
    carousels:JSON.parse(JSON.stringify(CAROUSEL_SEED)),
    posts:JSON.parse(JSON.stringify(POST_SEED)),
    stories:JSON.parse(JSON.stringify(STORY_SEED)),
    captions:JSON.parse(JSON.stringify(CAPTIONS_SEED)),
    ctas:JSON.parse(JSON.stringify(CTA_SEED)),
    series:JSON.parse(JSON.stringify(SERIES_SEED)),
    campaigns:JSON.parse(JSON.stringify(CAMPAIGN_SEED)),
    kpi:JSON.parse(JSON.stringify(KPI_SEED)),
    saved:[],
    settings:{activeMonth:'m1'}
  };
}
function loadDB(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const d = JSON.parse(raw); if(d && d.plan && d.months) return d; }
  }catch(e){ console.warn('تعذّر قراءة النسخة المحفوظة، رح نستخدم النسخة الأصلية.',e); }
  return seedDB();
}
function saveDB(silent){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(DB));
    if(!silent) toast('تم الحفظ ✓');
    return true;
  }catch(e){ toast('ما قدرنا نحفظ — مساحة المتصفح ممتلئة','err'); return false; }
}
function saveAll(){ saveDB(); }
function resetAll(){
  if(!confirm('رح ترجع كل البيانات للنسخة الأصلية وتنمسح تعديلاتك. متأكد؟')) return;
  DB = seedDB(); saveDB(true); F={month:'',week:'',axis:'',format:'',series:'',pillar:'',funnel:'',purpose:'',status:''};
  render(); toast('رجعت النسخة الأصلية ✓');
}

/* ================= UTILS ================= */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function ax(k){ return AXES[k] || AXES.soc; }
function toast(msg,type){
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast on' + (type==='err'?' err':'');
  clearTimeout(el._t); el._t = setTimeout(()=>{ el.className='toast'; }, 2200);
}
function copyText(txt){
  const t = String(txt||'');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(t).then(()=>toast('تم النسخ ✓'),()=>fallbackCopy(t));
  } else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('تم النسخ ✓'); }catch(e){ toast('ما قدرنا ننسخ','err'); }
  document.body.removeChild(ta);
}
function copyField(id,field){ const it = DB.plan.find(p=>p.id===id); if(!it) return; copyText(it[field]||''); }
function copyReelScript(id){ const it=DB.plan.find(p=>p.id===id); if(!it||!it.reelDetails) return; copyText(it.reelDetails.script||''); }
function uid(pre){ return (pre||'x') + Date.now().toString(36) + Math.floor(Math.random()*900+100); }
function activeMonth(){ return DB.months.find(m=>m.id===DB.settings.activeMonth) || DB.months[0]; }
function monthItems(){ const m = activeMonth(); return DB.plan.filter(p=>p.monthId===(m?m.id:'')); }
function toggleNav(force){
  const n=document.getElementById('nav'), s=document.getElementById('scrim');
  const open = force===undefined ? !n.classList.contains('open') : force;
  n.classList.toggle('open',open); s.classList.toggle('on',open);
}

/* ================= NAVIGATION ================= */
const SECTIONS = [
  {k:'overview',n:'نظرة عامة',g:'الاستراتيجية'},
  {k:'brand',n:'استراتيجية البراند',g:'الاستراتيجية'},

  {k:'content',n:'كل المحتوى',g:'التخطيط'},
  {k:'campaigns',n:'الحملات',g:'التخطيط'},
  {k:'reels',n:'بنك الريلز',g:'المكتبات'},
  {k:'hooks',n:'مكتبة الهوكات',g:'المكتبات'},
  {k:'carousel',n:'الكاروسيل',g:'المكتبات'},
  {k:'posts',n:'البوستات',g:'المكتبات'},
  {k:'stories',n:'الستوري',g:'المكتبات'},
  {k:'captions',n:'الكابشن',g:'المكتبات'},
  {k:'cta',n:'CTA',g:'المكتبات'},
  {k:'series',n:'السلاسل',g:'المكتبات'},
  {k:'visual',n:'الهوية البصرية',g:'التنفيذ'},
  {k:'kpi',n:'KPI والأداء',g:'التنفيذ'},
  {k:'saved',n:'الأفكار المحفوظة',g:'التنفيذ'}
];
function renderNav(){
  let html='', lastG='';
  SECTIONS.forEach((s,i)=>{
    if(s.g!==lastG){ html += `<div class="navgroup">${esc(s.g)}</div>`; lastG=s.g; }
    const num = String(i+1).padStart(2,'0');
    html += `<button class="navbtn ${VIEW===s.k?'on':''}" onclick="go('${s.k}')"><span class="n">${num}</span><span>${esc(s.n)}</span></button>`;
  });
  document.getElementById('navlist').innerHTML = html;
}
function go(k){ VIEW=k; SEARCH=''; const q=document.getElementById('q'); if(q) q.value=''; toggleNav(false); window.scrollTo(0,0); render(); }

/* ================= MONTH MANAGEMENT ================= */
function renderMonthSelect(){
  const sel = document.getElementById('monthSel');
  sel.innerHTML = DB.months.map(m=>`<option value="${esc(m.id)}" ${m.id===DB.settings.activeMonth?'selected':''}>${esc(m.name)}</option>`).join('')
    + `<option value="__add">+ إضافة شهر</option><option value="__rename">✎ إعادة تسمية</option><option value="__del">🗑 حذف الشهر</option>`;
}
function switchMonth(v){
  if(v==='__add'){ addMonth(); return; }
  if(v==='__rename'){ renameMonth(); return; }
  if(v==='__del'){ deleteMonth(); return; }
  DB.settings.activeMonth = v; saveDB(true); render();
}
function addMonth(){
  const name = prompt('اسم الشهر الجديد (مثال: سبتمبر 2026):');
  if(!name){ renderMonthSelect(); return; }
  const start = prompt('تاريخ أول يوم بالشهر (YYYY-MM-DD):','2026-09-01') || '2026-09-01';
  const d = new Date(start+'T00:00:00');
  const m = {id:uid('m'), name:name.trim(), start:start, days:30, startWeekday: isNaN(d.getTime())?6:d.getDay()};
  DB.months.push(m); DB.settings.activeMonth = m.id; saveDB(true); render(); toast('انضاف الشهر ✓');
}
function renameMonth(){
  const m = activeMonth(); if(!m){ renderMonthSelect(); return; }
  const name = prompt('الاسم الجديد للشهر:', m.name);
  if(name && name.trim()){ m.name = name.trim(); saveDB(true); }
  render();
}
function deleteMonth(){
  const m = activeMonth(); if(!m){ return; }
  if(DB.months.length<=1){ toast('ما بتقدر تحذف آخر شهر','err'); renderMonthSelect(); return; }
  const count = DB.plan.filter(p=>p.monthId===m.id).length;
  const msg = count ? `الشهر "${m.name}" فيه ${count} محتوى ورح ينمسح كله. متأكد؟` : `حذف الشهر "${m.name}"؟`;
  if(!confirm(msg)){ renderMonthSelect(); return; }
  DB.plan = DB.plan.filter(p=>p.monthId!==m.id);
  DB.months = DB.months.filter(x=>x.id!==m.id);
  DB.settings.activeMonth = DB.months[0].id; saveDB(true); render(); toast('انحذف الشهر ✓');
}
function addDay(){
  const m = activeMonth(); if(!m) return;
  m.days = (m.days||30) + 1; saveDB(true); render(); toast('انضاف يوم ✓');
}
function addWeek(){
  const m = activeMonth(); if(!m) return;
  m.days = (m.days||30) + 7; saveDB(true); render(); toast('انضاف أسبوع ✓');
}
function dateFor(m,day){
  if(!m || !m.start) return '';
  const d = new Date(m.start+'T00:00:00'); if(isNaN(d.getTime())) return '';
  d.setDate(d.getDate() + (day-1));
  return d.toISOString().slice(0,10);
}

/* ================= SEARCH ================= */
function onSearch(v){ SEARCH = (v||'').trim(); render(); }
function matchesSearch(o, fields){
  if(!SEARCH) return true;
  const q = SEARCH.toLowerCase();
  return fields.some(f=>{
    const val = o[f];
    if(val==null) return false;
    if(Array.isArray(val)) return val.join(' ').toLowerCase().includes(q);
    if(typeof val==='object') return JSON.stringify(val).toLowerCase().includes(q);
    return String(val).toLowerCase().includes(q);
  });
}
const PLAN_SEARCH_FIELDS = ['title','hook','caption','idea','series','axis','keywords','notes','cta','objective','structure','visual','design'];

/* ================= FILTERS ================= */
function setF(k,v){ F[k]=v; render(); }
function clearF(){ F={month:'',week:'',axis:'',format:'',series:'',pillar:'',funnel:'',purpose:'',status:''}; render(); }
function filteredPlan(){
  let list = monthItems();
  if(F.week) list = list.filter(p=>String(p.week)===String(F.week));
  if(F.axis) list = list.filter(p=>p.axis===F.axis);
  if(F.format) list = list.filter(p=>p.format===F.format);
  if(F.series) list = list.filter(p=>p.series===F.series);
  if(F.pillar) list = list.filter(p=>p.pillar===F.pillar);
  if(F.funnel) list = list.filter(p=>p.funnel===F.funnel);
  if(F.purpose) list = list.filter(p=>p.purpose===F.purpose);
  if(F.status) list = list.filter(p=>p.status===F.status);
  list = list.filter(p=>matchesSearch(p, PLAN_SEARCH_FIELDS));
  return list.sort((a,b)=>a.day-b.day);
}
function selOpts(obj,val){ return Object.keys(obj).map(k=>`<option value="${esc(k)}" ${val===k?'selected':''}>${esc(obj[k])}</option>`).join(''); }

/* ================= EXPORT / IMPORT ================= */
function exportJSON(){
  const blob = new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='al-ghazawe-content-strategy-backup.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),800);
  toast('تم تصدير النسخة ✓');
}
function importJSON(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const d = JSON.parse(reader.result);
      if(!d || !Array.isArray(d.plan) || !Array.isArray(d.months)) throw new Error('bad');
      const merged = seedDB();
      Object.keys(merged).forEach(k=>{ if(d[k]!==undefined) merged[k]=d[k]; });
      if(!merged.settings || !merged.settings.activeMonth) merged.settings={activeMonth:merged.months[0].id};
      if(!merged.months.some(m=>m.id===merged.settings.activeMonth)) merged.settings.activeMonth = merged.months[0].id;
      DB = merged; saveDB(true); render(); toast('تم استيراد الملف ✓');
    }catch(e){ toast('الملف مش صالح — لازم يكون نسخة تصدير من هالنظام','err'); }
    ev.target.value='';
  };
  reader.onerror = function(){ toast('ما قدرنا نقرأ الملف','err'); ev.target.value=''; };
  reader.readAsText(file);
}

}
function delSaved(id){

}
function savedToPlan(id){
  const s = DB.saved.find(x=>x.id===id); if(!s) return;
  const m = activeMonth();
  const day = (monthItems().reduce((mx,p)=>Math.max(mx,p.day),0)||0)+1;

  DB.plan.push(newItem({monthId:m.id,day:day,date:dateFor(m,day),week:Math.ceil(day/7),axis:s.axis,title:s.title,idea:s.body}));

}

function metricRates(m){
  const v = Number(m.views||0), r = Number(m.reach||0);

  if(!v && !r) return 'لسا ما تم إدخال أرقام. عبّي الأرقام الحقيقية بعد النشر.';
  const base = r||v;
  return `نسبة التفاعل: ${((eng/base)*100).toFixed(1)}٪ · نسبة الحفظ: ${((Number(m.saves||0)/base)*100).toFixed(1)}٪ · رسائل لكل ١٠٠٠ وصول: ${((Number(m.dms||0)/base)*1000).toFixed(1)}`;
}
function updMetric(id,key,val){
  const it = DB.plan.find(p=>p.id===id); if(!it) return;
  it.metrics = it.metrics||{}; it.metrics[key] = Number(val)||0; saveDB(true);
}

function val(id){ const el=document.getElementById(id); return el?el.value:''; }
function lines(id){ return val(id).split('\n').map(s=>s.trim()).filter(Boolean); }
function saveItem(id){
  const isNew = !id;
  let it = isNew ? newItem() : DB.plan.find(p=>p.id===id);
  if(!it) return;
  const title = val('e_title').trim();
  if(!title){ toast('اكتب عنوان للمحتوى قبل الحفظ','err'); return; }
  it.day = Number(val('e_day'))||1;
  it.date = val('e_date');
  it.week = Number(val('e_week'))||Math.ceil(it.day/7);
  it.status = val('e_status'); it.axis = val('e_axis'); it.format = val('e_format');
  it.series = val('e_series').trim(); it.pillar = val('e_pillar');
  it.funnel = val('e_funnel'); it.purpose = val('e_purpose'); it.keywords = val('e_keywords');
  it.title = title; it.objective = val('e_objective'); it.audience = val('e_audience');
  it.idea = val('e_idea'); it.hook = val('e_hook'); it.structure = val('e_structure');
  it.caption = val('e_caption'); it.cta = val('e_cta'); it.visual = val('e_visual');
  it.design = val('e_design'); it.notes = val('e_notes');
  it.carouselSlides = lines('e_slides');
  it.storyFrames = lines('e_frames');
  const r = {
    duration:val('e_r_duration'),cover:val('e_r_cover'),ctaFrame:val('e_r_ctaFrame'),
    openingShot:val('e_r_openingShot'),t02:val('e_r_t02'),t25:val('e_r_t25'),t510:val('e_r_t510'),
    t1020:val('e_r_t1020'),ending:val('e_r_ending'),shotList:lines('e_r_shotList'),
    onScreenText:lines('e_r_onScreenText'),script:val('e_r_script'),camera:val('e_r_camera'),
    broll:val('e_r_broll'),editing:val('e_r_editing'),transitions:val('e_r_transitions'),audio:val('e_r_audio')
  };
  const hasReel = Object.keys(r).some(k=>Array.isArray(r[k])?r[k].length:String(r[k]||'').trim());
  it.reelDetails = hasReel ? r : null;
  if(isNew){ it.monthId = (activeMonth()||{}).id; DB.plan.push(it); }
  const m = activeMonth();
  if(m && it.day > (m.days||30)) m.days = it.day;
  saveDB(); closeModal(); render();
}

/* ================= LIBRARY → PLAN ================= */
function libToPlan(kind,i){
  const m = activeMonth();
  const day = (monthItems().reduce((mx,p)=>Math.max(mx,p.day),0)||0)+1;
  if(day > (m.days||30)) m.days = day;
  let o, item;
  const base = {monthId:m.id, day:day, date:dateFor(m,day), week:Math.ceil(day/7), status:'idea'};
  if(kind==='reel'){
    o = DB.reels[i];
    item = newItem(Object.assign({},base,{axis:o.a,series:o.s,format:'reel',title:o.t,hook:o.hook,idea:o.c,objective:o.obj,cta:o.cta,
      reelDetails:Object.assign(emptyReel(),{duration:o.dur,openingShot:o.fmt})}));
  } else if(kind==='carousel'){
    o = DB.carousels[i];
    item = newItem(Object.assign({},base,{axis:o.a,format:'carousel',title:o.t,idea:o.type,cta:o.cta,carouselSlides:(o.slides||[]).slice()}));
  } else if(kind==='post'){
    o = DB.posts[i];
    item = newItem(Object.assign({},base,{axis:o.a,format:'post',title:o.t,hook:o.h,idea:o.type,visual:o.v,cta:o.cta}));
  } else if(kind==='story'){
    o = DB.stories[i];
    item = newItem(Object.assign({},base,{axis:o.a,format:'story',title:o.t,idea:o.type,storyFrames:(o.f||[]).slice(),caption:'—'}));
  } else return;
  DB.plan.push(item); saveDB(true); toast('انضاف للخطة ✓'); render();
}

<script>

let LF = {axis:'',cat:''};

/* safe copy helpers — no inline literals inside HTML attributes */
function libItem(bank,i){ return (DB[bank]||[])[i]; }

function vKPI(){

      <div class="grid g3">
        <label class="fld"><span>العنوان</span><input type="text" id="si_t" placeholder="سؤال من متابع، فكرة ريل، ملاحظة…"></label>
        <label class="fld"><span>التفاصيل</span><input type="text" id="si_b" placeholder="اختياري"></label>
        <label class="fld"><span>المحور</span><select id="si_a">${Object.keys(AXES).map(k=>`<option value="${k}">${AXES[k].icon} ${AXES[k].name}</option>`).join('')}</select></label>
      </div>
      <button class="btn p" onclick="quickSave()">احفظ الفكرة</button>
    </div>`;
}
function quickSave(){
  const t = (document.getElementById('si_t')||{}).value||'';
  if(!t.trim()){ toast('اكتب عنوان للفكرة','err'); return; }
  saveIdea('فكرة', t.trim(), (document.getElementById('si_b')||{}).value||'', (document.getElementById('si_a')||{}).value||'soc');
  render();
}

/* ================= INIT ================= */
(function init(){
  DB = loadDB();
  if(!DB.settings) DB.settings = {activeMonth:DB.months[0].id};
  if(!DB.months.some(m=>m.id===DB.settings.activeMonth)) DB.settings.activeMonth = DB.months[0].id;
  render();
})();
</script>
</body>
</html>
